name: Sync YouTube Shorts

on:
  schedule:
    # Каждые 15 минут проверяем новый YouTube-канал на публичные Shorts
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: rotate-video
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Run rotation script
        run: node scripts/rotate-video.mjs

      - name: Commit and push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "dom2-video-bot"
            git config user.email "actions@users.noreply.github.com"
            git add lib/home-media.js
            git commit -m "chore: sync YouTube Shorts"
            git push
          else
            echo "Новых Shorts нет, изменений не требуется."
          fi
