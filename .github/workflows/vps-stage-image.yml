name: Build VPS staging image
on:
  push:
    branches: [codex/vps-migration-20261103]
permissions:
  contents: read
concurrency:
  group: dom2-vps-stage-image
  cancel-in-progress: true
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build with existing locked dependencies
        run: docker build --build-arg GIT_SHA="$GITHUB_SHA" -t "brabus-dom2-stage:$GITHUB_SHA" .
      - name: Export the built image
        run: |
          docker save "brabus-dom2-stage:$GITHUB_SHA" | gzip -1 > dom2-stage.tar.gz
          test "$(stat -c '%s' dom2-stage.tar.gz)" -lt 262144000
          sha256sum dom2-stage.tar.gz > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > COMMIT_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dom2-stage-image
          path: |
            dom2-stage.tar.gz
            SHA256SUMS
            COMMIT_SHA
          retention-days: 1
          compression-level: 0
